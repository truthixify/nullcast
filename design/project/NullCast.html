<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NullCast</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    /* Surfaces */
    --bg-0: #0C0B0A;
    --bg-1: #141311;
    --bg-2: #1A1815;
    --bg-3: #221F1B;

    /* Text */
    --ink-1: #E8E0D4;
    --ink-2: #A89E90;
    --ink-3: #6B6560;
    --ink-4: #3D3A36;

    /* Accents */
    --gold: #D4A843;
    --gold-dim: #8A6F2C;
    --gold-glow: rgba(212, 168, 67, 0.22);

    /* Sides */
    --yes: #6B9B7A;
    --yes-dim: #3F5B48;
    --yes-glow: rgba(107, 155, 122, 0.18);
    --no: #B86B6B;
    --no-dim: #6B3F3F;
    --no-glow: rgba(184, 107, 107, 0.18);

    /* Privacy (transient only) */
    --cipher: #7B7FBF;

    /* Borders */
    --line: rgba(255, 240, 220, 0.04);
    --line-2: rgba(255, 240, 220, 0.08);
    --line-hot: rgba(255, 240, 220, 0.16);

    /* Fonts */
    --f-display: 'Cormorant Garamond', 'Source Serif 4', Georgia, serif;
    --f-body: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-0);
    color: var(--ink-1);
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
  }

  /* Warm-grain body ambience */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(212, 168, 67, 0.035), transparent 60%),
      radial-gradient(800px 600px at -10% 110%, rgba(123, 127, 191, 0.025), transparent 60%);
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  /* Tabular mono always */
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; letter-spacing: -0.01em; }
  .serif { font-family: var(--f-display); letter-spacing: -0.01em; }

  /* Utility */
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--gold-glow); color: var(--ink-1); }

  /* Scrollbars — almost invisible */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-hot); }

  /* ===== Cursor-following border glow ===== */
  .glow-card {
    position: relative;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: border-color 240ms ease, background-color 240ms ease;
    overflow: hidden;
  }
  .glow-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: radial-gradient(
      260px circle at var(--mx, 50%) var(--my, 50%),
      rgba(212, 168, 67, 0.28),
      rgba(212, 168, 67, 0.05) 40%,
      transparent 70%
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0;
    transition: opacity 280ms ease;
    pointer-events: none;
  }
  .glow-card:hover::before { opacity: 1; }
  .glow-card:hover { border-color: var(--line-hot); }

  /* Odds bar transitions */
  .odds-fill { transition: width 640ms cubic-bezier(0.22, 1, 0.36, 1); }

  /* Pulse dot */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 10px var(--gold-glow);
    animation: pulse-dot 2.2s ease-in-out infinite;
    display: inline-block;
  }

  /* Shimmer on success */
  @keyframes shimmer {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(120%); }
  }
  .shimmer {
    position: relative; overflow: hidden;
  }
  .shimmer.fire::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(212, 168, 67, 0.45), transparent 70%);
    animation: shimmer 900ms ease-out 1;
    pointer-events: none;
  }

  /* Ripple from bet placement */
  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(6); opacity: 0; }
  }
  .ripple-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
  .ripple-dot {
    position: absolute;
    width: 24px; height: 24px;
    border-radius: 50%;
    transform-origin: center;
    animation: ripple 900ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Slot-machine decrypt cells */
  .cipher-cell {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }
  .cipher-cell.revealing { color: var(--cipher); }
  .cipher-cell.revealed { color: var(--ink-1); }

  @keyframes gold-bloom {
    0% { text-shadow: 0 0 0 rgba(212, 168, 67, 0); }
    30% { text-shadow: 0 0 18px rgba(212, 168, 67, 0.55); }
    100% { text-shadow: 0 0 0 rgba(212, 168, 67, 0); }
  }
  .bloom-gold { animation: gold-bloom 1200ms ease-out 1; }

  /* Page fade-slide */
  @keyframes page-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-in { animation: page-in 360ms cubic-bezier(0.22, 1, 0.36, 1); }

  /* Ticker */
  @keyframes ticker-flow {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .ticker-track {
    display: flex;
    width: max-content;
    animation: ticker-flow 60s linear infinite;
  }

  /* Command palette backdrop */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scale-in { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .kbd {
    font-family: var(--f-mono);
    font-size: 10px;
    padding: 2px 5px;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    color: var(--ink-2);
    background: var(--bg-2);
  }

  /* Focus ring */
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 1px solid var(--gold-dim);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="root"></div>
